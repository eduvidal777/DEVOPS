name: Implementación EKS + CI/CD

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "856519093406"
  EKS_CLUSTER: tienda-eks
  NAMESPACE: devops

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push back-ventas
        run: |
          docker build -t back-ventas ./back-Ventas_SpringBoot/Springboot-API-REST
          docker tag back-ventas:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/back-ventas:eks-v1
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/back-ventas:eks-v1

      - name: Build y Push back-despachos
        run: |
          docker build -t back-despachos ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker tag back-despachos:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/back-despachos:eks-v1
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/back-despachos:eks-v1

      - name: Build y Push front-despacho
        run: |
          docker build -t front-despacho ./front_despacho
          docker tag front-despacho:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/front-despacho:eks-v1
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/front-despacho:eks-v1

      - name: Conectar kubectl a EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Aplicar manifiestos Kubernetes
        run: |
          echo "=== Archivos en la carpeta k8s ==="
          ls -la k8s
    
          for file in k8s/*.yaml; do
            echo ""
            echo "=============================="
            echo "Aplicando: $file"
            echo "=============================="
    
            cat "$file"
    
            kubectl apply -f "$file"
          done

      - name: Reiniciar deployments
        run: |
          kubectl rollout restart deployment back-ventas -n $NAMESPACE
          kubectl rollout restart deployment back-despachos -n $NAMESPACE
          kubectl rollout restart deployment front-despacho -n $NAMESPACE

      - name: Verificar despliegue
        run: |
          kubectl rollout status deployment/back-ventas -n $NAMESPACE
          kubectl rollout status deployment/back-despachos -n $NAMESPACE
          kubectl rollout status deployment/front-despacho -n $NAMESPACE
          kubectl get pods -n $NAMESPACE
          kubectl get svc -n $NAMESPACE