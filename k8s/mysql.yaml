apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "admin123"
            - name: MYSQL_DATABASE
              value: "ventasdb"
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: devops
spec:
  selector:
    app: db
  ports:
    - port: 3306
      targetPort: 3306